name: Hlídač levné elektřiny
on:
  schedule:
    # GitHub počítá čas v UTC. SEČ (zimní čas) = UTC + 1 hodina.
    - cron: "30 13 * * *"   # 14:30 SEČ (v letním čase 15:30)
    - cron: "0 15 * * *"    # 16:00 SEČ (v letním čase 17:00) – záloha
  workflow_dispatch:
    inputs:
      vynutit:
        description: "Odeslat znovu, i když už dnes odešlo"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: elektrina
jobs:
  hlidac:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Kontrola (testy)
        run: python -m unittest discover -s elektrina/testy
      - name: Stáhnout ceny a poslat na Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python elektrina/hlidac.py ${{ inputs.vynutit && '--vynutit' || '' }}
      - name: Uložit historii do repozitáře
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elektrina/historie.csv elektrina/odeslano.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Ceny elektřiny $(date -u -d tomorrow +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((i * 3))
          done
          exit 1

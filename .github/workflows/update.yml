name: Denní aktualizace dat
on:
  schedule:
    - cron: "17 5 * * *"   # každý den v 5:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: data-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stáhnout zprávy, hodnocení aplikací a repo sazbu
        run: node scripts/update.mjs
      - name: Kontrola dat
        run: node tests/validate-data.mjs
      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-live.js
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace živých dat"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort; echo "Konflikt, data se uloží při dalším běhu"; exit 1; }
            sleep $((i * 3))
          done
          exit 1
